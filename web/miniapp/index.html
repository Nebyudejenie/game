<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Jo Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/wallet.css" />
</head>
<body>
  <div id="connection-banner"></div>
  <div id="toast" class="toast"></div>

  <!-- 2.1 Room list -->
  <main id="screen-rooms" class="screen" data-screen="rooms">
    <div class="room-list-header">
      <div class="balance-pill">
        <span>💰</span>
        <span class="amount" id="balance-amount">-- ETB</span>
      </div>
      <div class="header-actions">
        <button id="voice-settings-btn" class="icon-fab">🔊</button>
        <button id="open-wallet-btn" class="deposit-fab">+</button>
      </div>
    </div>
    <div id="voice-settings-panel" class="voice-settings-panel hidden">
      <div class="voice-settings-row">
        <span data-i18n="voice.title"></span>
        <div id="voice-switch-settings" class="switch on"><div class="switch-knob"></div></div>
      </div>
      <div class="voice-settings-row">
        <span data-i18n="voice.volume"></span>
        <input id="voice-volume-slider" type="range" min="0" max="100" value="100" />
      </div>
      <div class="voice-settings-row">
        <span data-i18n="voice.speed"></span>
        <input id="voice-speed-slider" type="range" min="50" max="150" value="100" />
      </div>
      <button id="voice-replay-btn" class="btn-secondary" data-i18n="voice.replay"></button>
    </div>
    <div id="room-list"></div>
  </main>

  <!-- 2.2 Card selection (LOBBY) -->
  <main id="screen-lobby" class="screen" data-screen="lobby">
    <div class="lobby-header">
      <span id="lobby-countdown" class="stat-value"></span>
    </div>
    <div id="card-grid" class="card-grid"></div>
    <button id="lobby-cta" class="btn-primary" disabled></button>
  </main>

  <!-- 2.3 Game screen (RUNNING) + 2.4 Spectate -->
  <main id="screen-game" class="screen" data-screen="game">
    <div class="stat-strip">
      <div class="stat">
        <span class="stat-label" data-i18n="game.derash"></span>
        <span class="stat-value" id="stat-derash">0.00 ETB</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.players"></span>
        <span class="stat-value" id="stat-players">0</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.stake"></span>
        <span class="stat-value" id="stat-stake">0.00 ETB</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="game.call"></span>
        <span class="stat-value" id="stat-call">0/75</span>
      </div>
    </div>

    <div id="spectate-banner" class="spectate-banner hidden">
      <p data-i18n="spectate.banner"></p>
      <button id="reserve-card-btn" class="btn-primary" style="margin-top:8px" data-i18n="spectate.reserve"></button>
    </div>

    <div class="call-row">
      <span data-i18n="game.your_card" style="display:none"></span>
      <div class="recent-calls" id="recent-calls"></div>
    </div>

    <div class="game-body">
      <div id="board"></div>
      <div class="call-panel">
        <div id="call-badge" class="call-badge"></div>
        <div class="auto-toggle">
          <span data-i18n="game.auto"></span>
          <div id="auto-switch" class="switch on"><div class="switch-knob"></div></div>
        </div>
        <div class="auto-toggle">
          <span data-i18n="voice.title"></span>
          <div id="voice-switch" class="switch on"><div class="switch-knob"></div></div>
        </div>
      </div>
    </div>

    <div id="your-card-section" class="your-card-section">
      <div class="your-card-title" data-i18n="game.your_card"></div>
      <div id="your-card"></div>
      <button id="bingo-btn" class="btn-primary bingo-btn" disabled data-i18n="game.bingo"></button>
    </div>
  </main>

  <!-- 2.5 Result (SETTLING) -->
  <main id="screen-result" class="screen result-screen" data-screen="result">
    <div id="result-title" class="result-title"></div>
    <div id="result-amount" class="result-amount"></div>
    <div id="result-meta" class="result-meta"></div>
    <div id="result-session" class="result-session"></div>
    <div class="result-actions">
      <button id="play-next-btn" class="btn-primary btn-gold" data-i18n="result.play_next"></button>
      <button id="verify-draw-btn" class="btn-secondary" data-i18n="result.verify_draw"></button>
    </div>
    <div id="fairness-panel" class="fairness-panel hidden">
      <div class="fairness-row">
        <span data-i18n="fairness.verified_label"></span>
        <span id="fairness-verified"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_hash_label"></span>
        <span id="fairness-hash" class="fairness-value"></span>
      </div>
      <div class="fairness-row">
        <span data-i18n="fairness.seed_label"></span>
        <span id="fairness-seed" class="fairness-value"></span>
      </div>
      <p class="wallet-note" data-i18n="fairness.explainer"></p>
      <button id="fairness-close-btn" class="btn-secondary" data-i18n="fairness.close"></button>
    </div>
  </main>

  <!-- 2.6 Wallet -->
  <main id="screen-wallet" class="screen" data-screen="wallet">
    <div class="wallet-header">
      <h2 data-i18n="wallet.title"></h2>
      <button id="wallet-back-btn">✕</button>
    </div>
    <div class="wallet-tabs">
      <div class="wallet-tab active" data-tab="balance" data-i18n="wallet.tab_balance"></div>
      <div class="wallet-tab" data-tab="deposit" data-i18n="wallet.tab_deposit"></div>
      <div class="wallet-tab" data-tab="withdraw" data-i18n="wallet.tab_withdraw"></div>
      <div class="wallet-tab" data-tab="history" data-i18n="wallet.tab_history"></div>
    </div>

    <div id="wallet-pane-balance" class="wallet-pane">
      <div class="wallet-card balance-hero">
        <div class="balance-icon">💰</div>
        <div class="balance-figures">
          <div class="balance-label" data-i18n="wallet.cash"></div>
          <div class="balance-value" id="wallet-cash">0.00 ETB</div>
        </div>
      </div>
      <div class="balance-secondary">
        <div class="balance-secondary-item">
          <div class="label" data-i18n="wallet.bonus"></div>
          <div class="value" id="wallet-bonus">0.00 ETB</div>
        </div>
        <div class="balance-secondary-item">
          <div class="label" data-i18n="wallet.locked"></div>
          <div class="value" id="wallet-locked">0.00 ETB</div>
        </div>
      </div>
    </div>
    <div id="wallet-pane-deposit" class="wallet-pane hidden">
      <div id="deposit-automatic-section">
        <div class="amount-chips" id="deposit-amount-chips">
          <button type="button" class="amount-chip" data-amount="50">50</button>
          <button type="button" class="amount-chip" data-amount="100">100</button>
          <button type="button" class="amount-chip" data-amount="200">200</button>
          <button type="button" class="amount-chip" data-amount="500">500</button>
        </div>
        <input id="deposit-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
        <button id="deposit-submit-btn" class="btn-primary" data-i18n="wallet.deposit_submit"></button>
        <p id="deposit-status" class="wallet-note"></p>
      </div>
      <button type="button" id="deposit-manual-toggle-btn" class="btn-secondary" data-i18n="wallet.manual_deposit_toggle"></button>

      <div id="deposit-manual-section" class="hidden">
        <p class="wallet-note" data-i18n="wallet.manual_deposit_intro"></p>
        <div id="deposit-manual-destinations"></div>
        <input id="deposit-manual-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
        <input id="deposit-manual-reference-input" class="wallet-input" type="text" data-i18n-placeholder="wallet.manual_reference_placeholder" />
        <button id="deposit-manual-submit-btn" class="btn-primary" data-i18n="wallet.manual_deposit_submit"></button>
        <p id="deposit-manual-status" class="wallet-note"></p>
        <button type="button" id="deposit-automatic-toggle-btn" class="btn-secondary hidden" data-i18n="wallet.deposit_automatic_toggle"></button>
      </div>
    </div>
    <div id="wallet-pane-withdraw" class="wallet-pane hidden">
      <input id="withdraw-amount-input" class="wallet-input" type="number" inputmode="decimal" min="0" step="1" data-i18n-placeholder="wallet.amount_placeholder" />
      <input id="withdraw-account-input" class="wallet-input" type="tel" inputmode="tel" data-i18n-placeholder="wallet.telebirr_placeholder" />
      <input id="withdraw-name-input" class="wallet-input" type="text" data-i18n-placeholder="wallet.holder_name_placeholder" />
      <label id="withdraw-manual-toggle-row" class="wallet-note" style="display:flex; align-items:center; gap:0.4rem;">
        <input type="checkbox" id="withdraw-manual-checkbox" />
        <span data-i18n="wallet.manual_withdraw_toggle"></span>
      </label>

      <div class="summary-card">
        <div class="summary-header">
          <span class="summary-title" data-i18n="wallet.summary_title"></span>
          <span class="status-pill" id="withdraw-summary-status" data-i18n="wallet.summary_not_submitted"></span>
        </div>
        <div class="summary-grid">
          <div>
            <div class="label" data-i18n="wallet.summary_amount"></div>
            <div class="value" id="withdraw-summary-amount">0 ETB</div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_account"></div>
            <div class="value" id="withdraw-summary-account" data-i18n="wallet.summary_not_provided"></div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_holder"></div>
            <div class="value" id="withdraw-summary-holder" data-i18n="wallet.summary_not_provided"></div>
          </div>
          <div>
            <div class="label" data-i18n="wallet.summary_processing_time"></div>
            <div class="value" data-i18n="wallet.summary_processing_time_value"></div>
          </div>
        </div>
      </div>

      <button id="withdraw-submit-btn" class="btn-primary" data-i18n="wallet.withdraw_submit"></button>
      <p id="withdraw-status" class="wallet-note"></p>
    </div>
    <div id="wallet-pane-history" class="wallet-pane hidden">
      <div class="amount-chips" id="history-filter-chips">
        <button type="button" class="amount-chip selected" data-filter="all" data-i18n="wallet.history_filter_all"></button>
        <button type="button" class="amount-chip" data-filter="won" data-i18n="wallet.history_filter_won"></button>
        <button type="button" class="amount-chip" data-filter="lost" data-i18n="wallet.history_filter_lost"></button>
      </div>
      <div id="history-list"></div>
    </div>
  </main>

  <script type="module" src="js/app.v6.js"></script>
</body>
</html>
