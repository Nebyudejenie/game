# Alert rules, verbatim from spec section 10.4: "balance reconciliation
# mismatch (page immediately), payout queue depth > 50, deposit success
# rate < 90%, p99 call latency > 1 s, any round voided."
#
# No Slack/PagerDuty/email receiver is wired up here -- that's a real
# credential this session doesn't have, the same reasoning
# SantimPay/ArifPay were left unbuilt (see DECISIONS.md). What's real and
# verified is that these rules are syntactically valid and actually load
# into a running Prometheus (`promtool check rules` / a real container
# refusing to start on bad YAML), and that they evaluate against the real
# metric names packages/core/metrics.py defines -- an operator only needs
# to point Alertmanager's receivers at real endpoints to get paged.

groups:
  - name: jo-bingo
    rules:
      - alert: LedgerReconciliationMismatch
        # reconcile_job.py (packages/core/reconcile_job.py) is a one-shot
        # CLI job with no long-running /metrics endpoint of its own, so it
        # pushes this metric to a Prometheus Pushgateway after each run
        # instead (job="reconcile_job") -- confirmed wired end to end, see
        # DECISIONS.md 2026-08-24. Scheduling reconcile_job.py itself
        # (cron/systemd-timer/k8s CronJob) remains a real deployment-time
        # decision, same as every other worker entrypoint in this codebase.
        expr: ledger_reconciliation_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "Ledger reconciliation found a cached-balance / ledger-entries mismatch"

      - alert: PaymentReconciliationMismatch
        # payout_worker.py runs services.payments.deposits
        # .run_provider_reconciliation() hourly (a real, wired periodic
        # sweep on that already-running process -- see DECISIONS.md), so
        # this fires from a real, live-scraped gauge, not a pushed one.
        expr: payment_reconciliation_mismatch_count > 0
        labels:
          severity: page
        annotations:
          summary: "A deposit's provider status/amount disagreed with our own records on the last reconciliation pass"

      - alert: PayoutQueueDepthHigh
        expr: payout_queue_depth > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Payout queue depth is {{ $value }}, above the 50 budget"

      - alert: DepositSuccessRateLow
        expr: >
          sum(rate(deposit_outcomes_total{outcome="credited"}[15m]))
          /
          sum(rate(deposit_outcomes_total[15m]))
          < 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deposit success rate below 90% over the last 15 minutes"

      - alert: CallAckLatencyP99High
        expr: >
          histogram_quantile(0.99, sum(rate(gateway_command_ack_seconds_bucket[5m])) by (le))
          > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 gateway command-to-ack latency above 1s over the last 5 minutes"

      - alert: RoundVoided
        expr: increase(engine_rounds_voided_total[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A round was voided and refunded in the last 5 minutes"
