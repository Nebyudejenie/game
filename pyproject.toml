[project]
name = "jobingo"
version = "0.1.0"
description = "Jo Bingo -- real-money multiplayer bingo on Telegram"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bcrypt>=4.1",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "asyncpg-stubs>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "playwright>=1.40",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not load and not e2e'"
markers = [
    "load: real-scale measurement tests (hundreds+ of concurrent sockets), excluded from the default run because their absolute latency numbers are sensitive to whatever else is sharing this process/CPU -- run standalone with `pytest -m load` for a clean reading, same reason real load tests run as their own dedicated process rather than interleaved with the correctness suite.",
    "e2e: real-browser tests (Playwright/Chromium), excluded from the default run because they need a Chromium binary most dev setups won't have installed -- run explicitly with `pytest -m e2e` after `playwright install chromium`.",
]

[tool.mypy]
strict = true
files = ["packages", "services", "migrations"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "services*"]
